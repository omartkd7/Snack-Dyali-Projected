<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Snack Dyali">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1300"/>
      <stop offset="45%" stop-color="#7a2e00"/>
      <stop offset="100%" stop-color="#d9622b"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe8b8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1000" cy="80" r="220" fill="url(#glow)"/>
  <circle cx="150" cy="260" r="180" fill="url(#glow)"/>

  <!-- subtle dot grid -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="60" cy="40" r="2"/><circle cx="110" cy="40" r="2"/><circle cx="160" cy="40" r="2"/>
    <circle cx="60" cy="90" r="2"/><circle cx="110" cy="90" r="2"/><circle cx="160" cy="90" r="2"/>
    <circle cx="1040" cy="220" r="2"/><circle cx="1090" cy="220" r="2"/><circle cx="1140" cy="220" r="2"/>
    <circle cx="1040" cy="260" r="2"/><circle cx="1090" cy="260" r="2"/><circle cx="1140" cy="260" r="2"/>
  </g>

  <!-- taco / plate icon -->
  <g transform="translate(90, 95)">
    <path d="M0 55 A55 55 0 0 1 110 55 Z" fill="#f4a300" stroke="#8a3b00" stroke-width="4"/>
    <path d="M8 55 A47 47 0 0 1 102 55 Z" fill="#ffce54"/>
    <rect x="10" y="48" width="90" height="8" rx="4" fill="#2e7d32"/>
    <rect x="16" y="40" width="78" height="7" rx="3.5" fill="#c62828"/>
    <rect x="20" y="33" width="70" height="6" rx="3" fill="#fff8e1"/>
  </g>

  <!-- title -->
  <text x="230" y="140" font-family="Verdana, Geneva, sans-serif" font-size="64" font-weight="700" fill="url(#titleGrad)">
    Snack Dyali
  </text>
  <text x="232" y="180" font-family="Verdana, Geneva, sans-serif" font-size="22" fill="#ffe8c2" opacity="0.92">
    Gestion de menu — Node.js · Express · PostgreSQL · React Native (Expo)
  </text>

  <!-- decorative underline -->
  <rect x="232" y="196" width="420" height="4" rx="2" fill="#ffb703"/>
</svg>
